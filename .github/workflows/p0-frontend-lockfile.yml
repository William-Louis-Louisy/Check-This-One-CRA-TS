name: P0 Frontend Regenerate Lockfile
on:
  push:
    branches: [security/p0-frontend-dependency-audit]

permissions:
  contents: write

concurrency:
  group: p0-frontend-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.repository == 'William-Louis-Louisy/Check-This-One-CRA-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      REACT_APP_API_URL: https://api.check-this-one.com
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-frontend-dependency-audit
          persist-credentials: true
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Regenerate package-lock from the manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Nonbreaking dependency resolution only
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || test "$?" -eq 1
      - name: Verify installation
        run: npm ci --no-fund
      - name: Test security and client code
        run: npm test -- --watch=false --runInBand
      - name: Compile React application
        run: npm run build
      - name: Commit only the checked lockfile when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(frontend): lock verified Axios v1 dependency updates'
            git push origin HEAD:refs/heads/security/p0-frontend-dependency-audit
          fi
      - name: Scan newly installed dependency tree
        run: npm audit --json > p0-frontend-after-audit.json || test "$?" -eq 1
      - name: Fail if direct Axios advisories remain
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const a = JSON.parse(fs.readFileSync("p0-frontend-after-audit.json", "utf8"));
          if (!a.metadata?.vulnerabilities) throw new Error("Missing audit results");
          console.log("Dependency audit:", JSON.stringify(a.metadata.vulnerabilities));
          const axios = a.vulnerabilities?.axios;
          if (axios && ["high", "critical"].includes(axios.severity)) {
            throw new Error("Direct Axios vulnerability remains: investigate before release");
          }
          NODE
      - name: Store post-upgrade audit
        uses: actions/upload-artifact@v4
        with:
          name: p0-frontend-after-audit
          path: p0-frontend-after-audit.json
          retention-days: 7
