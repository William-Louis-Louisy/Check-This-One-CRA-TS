name: CTO-03b Client Checks

on:
  pull_request:
    branches: [main, security/cto-03a-logout-client]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      REACT_APP_API_URL: https://api.check-this-one.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run client security tests
        run: npm test -- --watch=false --runInBand
      - name: Compile the React application
        run: npm run build
